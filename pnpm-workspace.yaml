packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: false
  msgpackr-extract: false
  better-sqlite3: true
  vue-demi: true

# `graphql-request@7.4.0` declara `graphql: 14 - 16` como peer. O repo roda
# `graphql@17`, que e o que o `graphql-yoga@5` e o Pothos do BFF pedem, entao o
# range do peer e que esta atras -- e nao so por types: o `analyzeDocument` do
# pacote importa `parse`/`print` do `graphql` em runtime, entao ele precisa de
# uma instancia real e nao compativel.
packageExtensions:
  graphql-request@7.4.0:
    peerDependencies:
      graphql: 14 - 17
