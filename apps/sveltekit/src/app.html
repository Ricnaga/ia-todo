<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script>
      // Define o modo antes da pintura para nao piscar a paleta errada.
      // As regras de preferencia/resolucao sao espelhadas em
      // src/lib/color-mode.svelte.ts; precisa rodar aqui porque app.html
      // nao consegue importar modulos.
      {
        const stored = localStorage.getItem('color-mode')
        const preference =
          stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto'
        const resolve = () =>
          preference === 'auto'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference
        document.documentElement.setAttribute('data-mode', resolve())
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
